# Level 2- Started 
name: environments and secrets demo

on:
    workflow_dispatch:

# Level 1 - Workflow level (sab jobs me available)
env:
    APP_NAME: "MyApp"
    ENV_TYPE: "dev"

jobs:
    print-variables:
        runs-on: ubuntu-latest
        steps:
            - name: Print environment variables
              run: |
                echo "Application Name: $APP_NAME"
                echo "Environment Type: $ENV_TYPE"
    
    print-variables-from-github:
        runs-on: ubuntu-latest
        steps:
            - name: Print GitHub secrets
              run: |
                echo "GitHub Var: ${{ vars.MY_VAR }}"


    print-secrets-from-github:
        runs-on: ubuntu-latest
        steps:
            - name: Print GitHub secrets
              run: |
                echo "GitHub Secret: ${{ secrets.MY_SECRET }}"
                

